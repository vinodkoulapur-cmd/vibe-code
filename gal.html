<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusLane – Smart Study Planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="golu.css">
</head>
<body>
  <header class="topbar">
    <h1>🎯 FocusLane</h1>
    <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode">🌙</button>
  </header>

  <main>
    <section class="hero">
      <div>
        <h2>Plan less. Study more.</h2>
        <p id="quote"></p>
        <p id="focus" class="focus"></p>
      </div>
      <div class="ring" id="ring" role="img" aria-label="Overall progress"><span id="ringText">0%</span></div>
    </section>

    <section class="stats" aria-label="Statistics">
      <div class="card"><b id="total">0</b><small>Total</small></div>
      <div class="card"><b id="doneCount">0</b><small>Done</small></div>
      <div class="card"><b id="streak">0</b><small>Streak</small></div>
    </section>

    <section class="card">
      <h3>Add a task</h3>
      <form id="taskForm" novalidate>
        <input id="title" placeholder="e.g. Solve 10 array problems" aria-label="Task name">
        <select id="subject" aria-label="Subject"></select>
        <input id="due" type="date" aria-label="Due date">
        <select id="priority" aria-label="Priority">
          <option>High</option><option selected>Medium</option><option>Low</option>
        </select>
        <button class="btn" type="submit">Add</button>
      </form>
      <p id="err" class="err" role="alert"></p>
    </section>

    <section>
      <div class="controls">
        <input id="search" type="search" placeholder="🔍 Search tasks" aria-label="Search tasks">
        <div class="tabs">
          <button class="tab active" data-status="all">All</button>
          <button class="tab" data-status="pending">Pending</button>
          <button class="tab" data-status="done">Done</button>
        </div>
        <select id="sort" aria-label="Sort tasks">
          <option value="due">Sort: Due date</option>
          <option value="priority">Sort: Priority</option>
        </select>
      </div>
      <ul id="list"></ul>
      <p id="empty" class="empty" hidden>🌱 No tasks here. Add one above!</p>
    </section>
  </main>

  <footer>Built for UXecution 2026</footer>
  <div id="toast" class="toast" role="status"></div>
  <script src="jago.js"></script>
</body>
</html>
